: Flutter Build APK from Zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          unzip zentro_flutter_3_32_final_clean_gradle_fixed.zip
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Kotlin Gradle Version Issues
        run: |
          find . -name "build.gradle" -exec sed -i "s/version '2.1.0'/version '1.9.20'/g" {} +
          find . -name "build.gradle" -exec sed -i "s/ext.kotlin_version = '2.1.0'/ext.kotlin_version = '1.9.20'/g" {} +

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
