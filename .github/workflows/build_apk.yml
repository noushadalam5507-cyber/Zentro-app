Flutter Build APK from Zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          unzip zentro_flutter_3_32_final_clean_gradle_fixed.zip
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd zentro_flutter_3_32_final_clean_gradle_fixed
          flutter pub get

      - name: Build APK
        run: |
          cd zentro_flutter_3_32_final_clean_gradle_fixed
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: zentro_flutter_3_32_final_clean_gradle_fixed/build/app/outputs/flutter-apk/app-release.apk
