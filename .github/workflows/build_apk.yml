name: Flutter Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project from Zip
        run: |
          mkdir temp_project
          unzip -o zentro_flutter_3* -d temp_project
          PROJ_ROOT=$(find temp_project -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "PROJECT_PATH=$PROJ_ROOT" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Clean and Override Kotlin Version
        run: |
          cd ${{ env.PROJECT_PATH }}
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/version "2.1.0"/version "1.9.24"/g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i "s/version '2.1.0'/version '1.9.24'/g" {} +

      - name: Build Flutter Project
        run: |
          cd ${{ env.PROJECT_PATH }}
          flutter pub get
          flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-release.apk
