name: Flutter Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project from Zip
        run: |
          mkdir temp_project
          unzip -o zentro_flutter_3* -d temp_project
          PROJ_ROOT=$(find temp_project -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "PROJECT_PATH=$PROJ_ROOT" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Patch Gradle and Kotlin Version Conflicts
        run: |
          cd ${{ env.PROJECT_PATH }}
          # जहाँ भी kotlin.android प्लगइन वर्ज़न के साथ है, उसका वर्ज़न हटाकर डिफ़ॉल्ट सेट करना
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android"/g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android'/g" {} +

      - name: Build Flutter Project
        run: |
          cd ${{ env.PROJECT_PATH }}
          flutter pub get
          flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            temp_project/**/build/app/outputs/flutter-apk/app-release.apk
